# Family Hub service launcher.
# Edited live: the site re-reads this file on change (no restart needed).
#
#   icon:   a dashboard-icons slug (https://dashboardicons.com), a full image URL, or an emoji
#   groups: Authelia groups that may SEE the tile. Omit = every signed-in user.
#           (Hiding a tile is not security; each service still needs its own
#           Authelia access_control rule.)

sections:
  - title: Watch & listen
    services:
      - name: Plex
        url: https://plex.example.com
        icon: plex
        description: Movies & TV
        groups: [family, extended-family]
      - name: Jellyfin
        url: https://jellyfin.example.com
        icon: jellyfin
        description: Movies & TV (alt)
        groups: [family]
      - name: Audiobookshelf
        url: https://audiobooks.example.com
        icon: audiobookshelf
        description: Audiobooks & podcasts
        groups: [family, extended-family]

  - title: Photos & files
    services:
      - name: Immich
        url: https://photos.example.com
        icon: immich
        description: Family photo library
        groups: [family]
      - name: Nextcloud
        url: https://cloud.example.com
        icon: nextcloud
        description: Shared files
        groups: [family]

  - title: Requests & home
    services:
      - name: Overseerr
        url: https://requests.example.com
        icon: overseerr
        description: Request a movie or show
        groups: [family, extended-family]
      - name: Home Assistant
        url: https://home.example.com
        icon: home-assistant
        description: Lights, locks & cameras
        groups: [family]

  - title: Admin
    services:
      - name: Write a post
        url: /_emdash/admin
        icon: ✍️
        description: EmDash editor
        groups: [admins]
      - name: Homepage
        url: https://dash.example.com
        icon: homepage
        description: Server dashboard
        groups: [admins]
      - name: Unraid
        url: https://tower.example.com
        icon: unraid
        description: Server admin
        groups: [admins]
