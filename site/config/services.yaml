# Family Hub service launcher: the starting app list.
# Edited live: the site re-reads this file on change (no restart needed),
# until an admin first saves on /admin/apps. From then on the list lives in
# the database and this file is ignored.
#
#   icon:   a dashboard-icons slug (https://dashboardicons.com), a full image URL, or an emoji
#   groups: lldap/Authelia groups that may SEE the tile. Omit = every signed-in user.
#   policy: optional (default; people can hide it) | always (can't be hidden) | hidden (off for everyone)
#           (Hiding a tile is not security; each service still needs its own
#           Authelia access_control rule.)

sections:
  - title: Watch & listen
    services:
      - name: Jellyfin
        url: https://jellyfin.example.com
        icon: jellyfin
        description: Our movies & TV, in place of Netflix, Disney+ & Max
        groups: [family, extended-family]
      - name: Audiobookshelf
        url: https://bookshelf.example.com
        icon: audiobookshelf
        description: Audiobooks & podcasts, in place of Audible & Spotify
        groups: [family, extended-family]

  - title: Photos & food
    services:
      - name: Immich
        url: https://photos.example.com
        icon: immich
        description: Family photo backup, in place of Google & iCloud Photos
        groups: [family]
      - name: Mealie
        url: https://shopping.example.com
        icon: mealie
        description: Recipes, meal plans & shopping lists, in place of Paprika & AnyList
        groups: [family]

  - title: Requests & home
    services:
      - name: Requests
        url: https://requests.example.com
        icon: jellyseerr
        description: Ask for a movie or show to be added to Jellyfin (Jellyseerr)
        groups: [family, extended-family]
      - name: Home Assistant
        url: https://ha.example.com
        icon: home-assistant
        description: Lights, locks & cameras, in place of Google Home, Alexa & Ring
        groups: [family]

  - title: Admin
    services:
      - name: Write a post
        url: /_emdash/admin
        icon: ✍️
        description: Post news & photos to the family feed, in place of Facebook
        groups: [manage-social, family, extended-family]
