# Family Hub service launcher.
# Edited live: the site re-reads this file on change (no restart needed).
#
#   icon:   a dashboard-icons slug (https://dashboardicons.com), a full image URL, or an emoji
#   groups: lldap/Authelia groups that may SEE the tile. Omit = every signed-in user.
#           (Hiding a tile is not security; each service still needs its own
#           Authelia access_control rule.)

sections:
  - title: Watch & listen
    services:
      - name: Jellyfin
        url: https://jellyfin.example.com
        icon: jellyfin
        description: Movies & TV
        groups: [family, extended-family]
      - name: Audiobookshelf
        url: https://bookshelf.example.com
        icon: audiobookshelf
        description: Audiobooks & podcasts
        groups: [family, extended-family]

  - title: Photos & food
    services:
      - name: Immich
        url: https://photos.example.com
        icon: immich
        description: Family photo library
        groups: [family]
      - name: Mealie
        url: https://shopping.example.com
        icon: mealie
        description: Recipes & shopping list
        groups: [family]

  - title: Requests & home
    services:
      - name: Requests
        url: https://requests.example.com
        icon: jellyseerr
        description: Request a movie or show
        groups: [family, extended-family]
      - name: Home Assistant
        url: https://ha.example.com
        icon: home-assistant
        description: Lights, locks & cameras
        groups: [family]

  - title: Admin
    services:
      - name: Write a post
        url: /_emdash/admin
        icon: ✍️
        description: Share news & photos
        groups: [manage-social, family, extended-family]
