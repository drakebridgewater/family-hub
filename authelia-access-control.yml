# Merge these into Authelia's configuration.yml -> access_control.rules.
# Rules are first-match, so put them ABOVE any catch-all rule for *.bridgewater.digital.

access_control:
  rules:
    # EmDash editor. EmDash also asks Authelia about this path on every editor
    # request (site/src/lib/emdash-auth.ts), so these rules decide who can
    # write; lldap groups then set the role (see astro.config.mjs).
    # manage-social = admin with 2FA; family/extended-family = author/contributor.
    # The deny is required: a non-matching subject rule falls through to the bypass below.
    - domain: social.bridgewater.digital
      resources:
        - '^/_emdash/admin([/?].*)?$'
      subject:
        - 'group:manage-social'
      policy: two_factor
    - domain: social.bridgewater.digital
      resources:
        - '^/_emdash/admin([/?].*)?$'
      subject:
        - 'group:family'
        - 'group:extended-family'
      policy: one_factor
    - domain: social.bridgewater.digital
      resources:
        - '^/_emdash/admin([/?].*)?$'
      policy: deny

    # The "Family sign in" button. The site also uses this rule to check,
    # server-side, whether a visitor already has a session.
    - domain: social.bridgewater.digital
      resources:
        - '^/login([?].*)?$'
      policy: one_factor

    # Everything else on the hub is public (the social feed)
    - domain: social.bridgewater.digital
      policy: bypass

# Make sure the session cookie covers the hub, e.g. (Authelia 4.38+):
# session:
#   cookies:
#     - domain: bridgewater.digital
#       authelia_url: https://authelia.bridgewater.digital
#
# Example users_database.yml groups used by site/config/services.yaml:
#   groups: [family]            -> household
#   groups: [extended-family]   -> grandparents, cousins…
#   groups: [family, manage-social] -> can open the EmDash editor
