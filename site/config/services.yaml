# Family Hub service launcher.
# Edited live: the site re-reads this file on change (no restart needed).
#
#   icon:   a dashboard-icons slug (https://dashboardicons.com), a full image URL, or an emoji
#   groups: lldap/Authelia groups that may SEE the tile. Omit = every signed-in user.
#           (Hiding a tile is not security; each service still needs its own
#           Authelia access_control rule.)

